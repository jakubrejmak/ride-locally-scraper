[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-locally-scraper"
version = "0.1.0"
description = "Ride Locally scraping and processing service"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy==2.0.50",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "python-dotenv==1.2.2",
    "pydantic-settings==2.14.2",
    "scrapling==0.4.8",
    # the Dockerfile installs browsers with this exact version - bump both together
    "playwright==1.60.0",
    "browserforge==1.2.4",
    "msgspec==0.21.1",
    "patchright==1.60.0",
    "curl_cffi==0.15.0",
    "croniter==6.2.2",
    "pydantic==2.13.4",
    "typing-extensions==4.15.0",
    "xlrd==2.0.2",
    "python-magic==0.4.27",
    # numpy 2.3+, and the deskew/scikit-image releases built on it, need Python 3.11+
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.4.6; python_version >= '3.11'",
    "deskew==1.5.3; python_version < '3.11'",
    "deskew==1.6.0; python_version >= '3.11'",
    "openrouter==0.9.1",
    "pillow==12.1.1",
    "scikit-image==0.25.2; python_version < '3.11'",
    "scikit-image==0.26.0; python_version >= '3.11'",
    "pymupdf==1.27.2.3",
    "openpyxl==3.1.5",
    "unidecode==1.4.0",
    "geoalchemy2==0.20.0",
]

[project.optional-dependencies]
api = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",
]

[project.scripts]
ride-locally-api = "ride_locally.api.main:main"
ride-locally-worker = "ride_locally.worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.21",
]
