[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-locally-scraper"
version = "0.1.0"
description = "Ride Locally scraping and processing service"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "python-dotenv",
    "pydantic-settings",
    "scrapling",
    "playwright",
    "browserforge",
    "msgspec",
    "patchright",
    "curl_cffi",
    "croniter",
    "pydantic",
    "typing-extensions",
    "xlrd",
    "python-magic",
    "numpy",
    "deskew",
    "openrouter",
    "pillow",
    "scikit-image",
    "pymupdf",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn[standard]",
    "argon2-cffi",
    "pyjwt",
]

[project.scripts]
ride-locally-api = "ride_locally.api.main:main"
ride-locally-worker = "ride_locally.worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
