services:
  scraper-api:
    build: .
    command: ["python", "main.py"]
    working_dir: /app/scraper_api
    environment:
      PYTHONPATH: /app
      API_HOST: 0.0.0.0
      API_RELOAD: "false"
    env_file:
      - .env
    ports:
      - "8000:8000"

  scraper-main:
    build: .
    command: ["python", "main.py"]
    working_dir: /app/scraper_main
    environment:
      PYTHONPATH: /app
    env_file:
      - .env
